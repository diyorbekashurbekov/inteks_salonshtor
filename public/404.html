<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <title>INTEKS Studio</title>
  <script>
    var href = window.location.href.toLowerCase();
    var pathname = window.location.pathname;
    var segments = pathname.split('/').filter(Boolean);
    var repo = segments[0] || '';
    var base = repo ? '/' + repo + '/' : '/';

    if (href.indexOf('admin') !== -1) {
      window.location.replace(base + '#admin');
    } else {
      window.location.replace(base);
    }
  </script>
</head>
<body style="background: #FAF7F2; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: system-ui, sans-serif; margin: 0;">
  <p style="color: #7A5714; font-size: 15px;">Жүктелуде...</p>
</body>
</html>
